<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#ec4899">
        <animate attributeName="stop-color" values="#ec4899;#38bdf8;#818cf8;#ec4899" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <style>
      .title { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 40px; fill: #ffffff; letter-spacing: -0.5px; }
      .gradient-text { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; font-size: 42px; fill: url(#accentGrad); letter-spacing: -0.5px; }
      .subtitle { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 400; font-size: 17px; fill: #94a3b8; letter-spacing: 0.2px; }
      .badge-text { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
      .category-pill { font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; font-size: 11px; fill: #38bdf8; text-transform: uppercase; letter-spacing: 1.5px; }
      
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatDelay {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes pulseRing {
        0% { transform: scale(0.95); opacity: 0.3; }
        50% { transform: scale(1.05); opacity: 0.8; }
        100% { transform: scale(0.95); opacity: 0.3; }
      }

      .floating-1 { animation: floatSlow 6s ease-in-out infinite; }
      .floating-2 { animation: floatDelay 7s ease-in-out infinite; }
      .pulsing { transform-origin: center; animation: pulseRing 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Ambient Light Orbs -->
  <circle cx="150" cy="100" r="180" fill="#38bdf8" opacity="0.12" filter="url(#glow)">
    <animate attributeName="cx" values="150;220;150" dur="12s" repeatCount="indefinite" />
    <animate attributeName="cy" values="100;140;100" dur="10s" repeatCount="indefinite" />
  </circle>
  <circle cx="1050" cy="300" r="200" fill="#a855f7" opacity="0.12" filter="url(#glow)">
    <animate attributeName="cx" values="1050;980;1050" dur="14s" repeatCount="indefinite" />
    <animate attributeName="cy" values="300;240;300" dur="11s" repeatCount="indefinite" />
  </circle>
  <circle cx="600" cy="350" r="160" fill="#6366f1" opacity="0.08" filter="url(#glow)" />

  <!-- Grid Overlay -->
  <rect width="1200" height="400" fill="url(#grid)" rx="16" />

  <!-- Decorative Modern Frame -->
  <rect x="2" y="2" width="1196" height="396" rx="14" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Left Icon / Graphic Element (Hotel & Tech Fusion) -->
  <g transform="translate(60, 95)">
    <!-- Tech Backdrop Ring -->
    <circle cx="95" cy="95" r="85" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1.5" />
    <circle cx="95" cy="95" r="95" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" stroke-dasharray="8 6" class="pulsing" />
    
    <!-- Building / PMS Icon Graphic -->
    <g transform="translate(48, 42)">
      <!-- Main Hotel Building -->
      <rect x="28" y="15" width="40" height="85" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      <rect x="5" y="40" width="23" height="60" rx="3" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
      <rect x="68" y="40" width="23" height="60" rx="3" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
      
      <!-- Hotel Windows with Glow -->
      <rect x="36" y="25" width="8" height="8" rx="1.5" fill="#38bdf8" opacity="0.9">
        <animate attributeName="opacity" values="0.9;0.3;0.9" dur="3s" repeatCount="indefinite" />
      </rect>
      <rect x="52" y="25" width="8" height="8" rx="1.5" fill="#fbbf24" opacity="0.8">
        <animate attributeName="opacity" values="0.8;0.2;0.8" dur="4s" repeatCount="indefinite" />
      </rect>
      <rect x="36" y="40" width="8" height="8" rx="1.5" fill="#38bdf8" opacity="0.7" />
      <rect x="52" y="40" width="8" height="8" rx="1.5" fill="#38bdf8" opacity="0.9" />
      <rect x="36" y="55" width="8" height="8" rx="1.5" fill="#fbbf24" opacity="0.85" />
      <rect x="52" y="55" width="8" height="8" rx="1.5" fill="#38bdf8" opacity="0.6" />
      <rect x="36" y="70" width="8" height="8" rx="1.5" fill="#38bdf8" opacity="0.9" />
      <rect x="52" y="70" width="8" height="8" rx="1.5" fill="#38bdf8" opacity="0.7" />
      
      <!-- Wing Windows -->
      <rect x="12" y="50" width="8" height="7" rx="1" fill="#818cf8" opacity="0.8" />
      <rect x="12" y="65" width="8" height="7" rx="1" fill="#818cf8" opacity="0.6" />
      <rect x="12" y="80" width="8" height="7" rx="1" fill="#fbbf24" opacity="0.8" />
      <rect x="75" y="50" width="8" height="7" rx="1" fill="#818cf8" opacity="0.7" />
      <rect x="75" y="65" width="8" height="7" rx="1" fill="#fbbf24" opacity="0.85" />
      <rect x="75" y="80" width="8" height="7" rx="1" fill="#818cf8" opacity="0.8" />
      
      <!-- Hotel Door & Canopy -->
      <rect x="42" y="88" width="12" height="12" rx="1" fill="#38bdf8" />
      <path d="M 38 88 L 58 88 L 55 83 L 41 83 Z" fill="#ec4899" />
      
      <!-- Crown / Star Accent -->
      <path d="M 48 4 L 51 10 L 57 10 L 52 14 L 54 20 L 48 16 L 42 20 L 44 14 L 39 10 L 45 10 Z" fill="#fbbf24" filter="url(#subtleGlow)" />
    </g>
  </g>

  <!-- Main Content Center & Right -->
  <g transform="translate(300, 75)">
    <!-- Top Pill / Badge -->
    <rect x="0" y="0" width="260" height="28" rx="14" fill="#0369a1" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1" />
    <circle cx="14" cy="14" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="28" y="18" class="category-pill">CURATED ECOSYSTEM 2026</text>

    <!-- Main Title -->
    <text x="0" y="70" class="title">Awesome Hotel</text>
    <text x="310" y="70" class="gradient-text">PMS</text>
    
    <!-- Subtitle -->
    <text x="0" y="105" class="subtitle">Curated Guide to SaaS Platforms, Open-Source Stacks &amp; Hospitality Tech</text>

    <!-- Floating Feature Badges Row 1 -->
    <g transform="translate(0, 140)" class="floating-1">
      <!-- Badge 1: Front Desk -->
      <g transform="translate(0, 0)">
        <rect width="130" height="38" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
        <text x="14" y="24" class="badge-text">🛎️ Front Desk</text>
      </g>
      
      <!-- Badge 2: Reservations -->
      <g transform="translate(142, 0)">
        <rect width="145" height="38" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
        <text x="14" y="24" class="badge-text">📅 Reservations</text>
      </g>

      <!-- Badge 3: Housekeeping -->
      <g transform="translate(299, 0)">
        <rect width="150" height="38" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
        <text x="14" y="24" class="badge-text">🧹 Housekeeping</text>
      </g>

      <!-- Badge 4: Channel Manager -->
      <g transform="translate(461, 0)">
        <rect width="165" height="38" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
        <text x="14" y="24" class="badge-text">🌐 Channel Manager</text>
      </g>

      <!-- Badge 5: Open Source -->
      <g transform="translate(638, 0)">
        <rect width="155" height="38" rx="8" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1" />
        <text x="14" y="24" class="badge-text" fill="#38bdf8">⚡ Open-Source</text>
      </g>
    </g>

    <!-- Floating Feature Badges Row 2 -->
    <g transform="translate(0, 190)" class="floating-2">
      <!-- Badge 6: Billing & POS -->
      <g transform="translate(0, 0)">
        <rect width="140" height="38" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
        <text x="14" y="24" class="badge-text">💳 Billing &amp; POS</text>
      </g>

      <!-- Badge 7: Guest Journey -->
      <g transform="translate(152, 0)">
        <rect width="150" height="38" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
        <text x="14" y="24" class="badge-text">📱 Guest Journey</text>
      </g>

      <!-- Badge 8: Revenue Management -->
      <g transform="translate(314, 0)">
        <rect width="185" height="38" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1" />
        <text x="14" y="24" class="badge-text">📈 Revenue &amp; Yield</text>
      </g>

      <!-- Badge 9: AI & Automation -->
      <g transform="translate(511, 0)">
        <rect width="165" height="38" rx="8" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1" />
        <text x="14" y="24" class="badge-text" fill="#c084fc">🤖 AI Automation</text>
      </g>
    </g>

    <!-- Bottom Metrics / SEO Keywords Bar -->
    <g transform="translate(0, 250)">
      <text x="0" y="20" font-family="'Inter', sans-serif" font-size="12" fill="#64748b" letter-spacing="0.5">
        🏨 PMS • 📊 ERP • 🔗 OTA APIs • 🏷️ PRICING &amp; FREE TRIALS • ⭐ GITHUB STARS • 🚀 SELF-HOSTING
      </text>
    </g>
  </g>
</svg>
